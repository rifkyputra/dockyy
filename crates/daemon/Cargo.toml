[package]
name = "kuadrat-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kuadrat-core = { path = "../core" }
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.7"
async-stream = "0.3"
futures-core = "0.3"
maud = { version = "0.26", features = ["axum"] }
# Already in the tree at v2.3.2, pulled in by both axum and form_urlencoded —
# declaring it directly adds a dependency edge, not a new crate, per `cargo
# tree -i percent-encoding`.
percent-encoding = "2.3"

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
# `test-util` only: unifies into test builds via the same tokio crate already
# a normal dependency above, so the retry test can pause the clock instead of
# a real three-second sleep. Not present in the production binary.
tokio = { workspace = true, features = ["test-util"] }
# Already a workspace dependency of kuadrat-core (its own tests use the same
# raw-connection trick to simulate a broken schema) — reused here to break the
# store out from under a live `Store`, not a new crate in the dependency tree.
rusqlite.workspace = true
