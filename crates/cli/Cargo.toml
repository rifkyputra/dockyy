[package]
name = "kuadrat"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kuadrat"
path = "src/main.rs"

[dependencies]
kuadrat-core = { path = "../core" }
kuadrat-daemon = { path = "../daemon" }
kuadrat-mcp = { path = "../mcp" }
anyhow.workspace = true
# `io-std` here only: the MCP subcommand reads stdin/writes stdout async;
# nothing else in the workspace touches tokio::io::{stdin,stdout}.
tokio = { workspace = true, features = ["io-std"] }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
