[package]
name = "kuadrat-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
rusqlite.workspace = true
tokio-stream.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `test-util` only: unifies into test builds via the same tokio crate already
# a normal dependency above, so the healthcheck budget tests can pause the
# clock instead of waiting real seconds. Not present in the production binary.
tokio = { workspace = true, features = ["test-util"] }
